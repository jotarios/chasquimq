[package]
name = "chasquimq-node"
version = "1.2.0"
description = "Node.js NAPI-RS bindings for the chasquimq message broker."
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = { version = "2", default-features = false, features = ["napi9", "async", "tokio_rt", "serde-json"] }
napi-derive = "2"
chasquimq = { path = "../chasquimq" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bytes = "1"
rmp-serde = "1"
thiserror = "1"
tracing = "0.1"
# `JsCredentialProvider` implements `fred::types::config::CredentialProvider`,
# which is `#[async_trait]`. The crate is already in the workspace lockfile
# (transitive via the engine's `fred` dep); pull it in directly here so the
# trait impl can annotate `#[async_trait]` without a stale version skew.
async-trait = "0.1"
# Direct dep on `fred` so the binding can implement
# `fred::types::config::CredentialProvider` and reference
# `fred::types::config::Server` / `fred::error::{Error, ErrorKind}` in the
# `JsCredentialProvider` impl. Pinned to the same version the engine uses
# (`Cargo.lock` resolves to a single 10.x); features kept minimal —
# `credential-provider` is the only one this crate needs.
fred = { version = "10", default-features = false, features = ["credential-provider"] }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
