name: Cross-Shim Wire Contract

on:
  push:
    branches: [main]
    paths:
      - 'chasquimq/**'
      - 'chasquimq-py/**'
      - 'chasquimq-node/**'
      - '.github/workflows/cross-shim.yml'
      - '.github/cross-shim-tests/**'
  pull_request:
    paths:
      - 'chasquimq/**'
      - 'chasquimq-py/**'
      - 'chasquimq-node/**'
      - '.github/workflows/cross-shim.yml'
      - '.github/cross-shim-tests/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  cross-shim:
    name: Python <-> Node wire-format parity (linux x64)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:8.6.2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'
          key: cross-shim-linux-x64

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: chasquimq-py/pyproject.toml

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            chasquimq-node/package-lock.json
            .github/cross-shim-tests/package-lock.json

      - name: Build Python wheel (release)
        uses: PyO3/maturin-action@v1
        with:
          working-directory: chasquimq-py
          target: x86_64-unknown-linux-gnu
          manylinux: auto
          args: --release --out dist --features pyo3/extension-module

      - name: Install Python wheel + runtime deps
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install chasquimq-py/dist/*.whl
          pip install 'redis>=5.0,<7' msgpack

      - name: Build Node native binding + TS shim
        working-directory: chasquimq-node
        run: |
          npm ci
          npm run build:debug
          npm run build:ts

      - name: Install cross-shim test fixtures
        working-directory: .github/cross-shim-tests
        run: npm install

      - name: Phase 1 — Python producer -> Node worker (immediate)
        id: phase1
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase1-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '50'
          TAG: py
          JOB_NAME: cross-py-immediate
          EXPECT_TAG: py
          EXPECT_JOB_NAME: cross-py-immediate
          MODE: immediate
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          python producer.py 2>&1 | tee /tmp/phase1-producer.log
          npx tsx worker.ts 2>&1 | tee /tmp/phase1-worker.log

      # Step ID + outcome gate: only the failing phase's dump runs, not every
      # subsequent phase's dump after the workflow first turns red.
      - name: Dump Redis state on Phase 1 failure
        if: failure() && steps.phase1.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase1-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN DLQ ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:dlq" || true
            echo "=== ZCARD delayed ==="
            docker exec "$REDIS_CID" redis-cli ZCARD "{chasqui:${QUEUE}}:delayed" || true
          } | tee /tmp/phase1-redis-state.log

      - name: Flush Redis between phases (immediate)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 2 — Node producer -> Python worker (immediate)
        id: phase2
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase2-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '50'
          TAG: node
          JOB_NAME: cross-node-immediate
          EXPECT_TAG: node
          EXPECT_JOB_NAME: cross-node-immediate
          MODE: immediate
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx producer.ts 2>&1 | tee /tmp/phase2-producer.log
          python worker.py 2>&1 | tee /tmp/phase2-worker.log

      - name: Dump Redis state on Phase 2 failure
        if: failure() && steps.phase2.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase2-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN DLQ ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:dlq" || true
            echo "=== ZCARD delayed ==="
            docker exec "$REDIS_CID" redis-cli ZCARD "{chasqui:${QUEUE}}:delayed" || true
          } | tee /tmp/phase2-redis-state.log

      - name: Flush Redis between phases (delayed)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 3 — Python delayed producer -> Node worker
        id: phase3
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase3-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '50'
          TAG: py
          JOB_NAME: cross-py-delayed
          EXPECT_TAG: py
          EXPECT_JOB_NAME: cross-py-delayed
          MODE: delayed
          TIMEOUT_SECS: '60'
        shell: bash
        run: |
          set -euo pipefail
          python producer.py 2>&1 | tee /tmp/phase3-producer.log
          npx tsx worker.ts 2>&1 | tee /tmp/phase3-worker.log

      - name: Dump Redis state on Phase 3 failure
        if: failure() && steps.phase3.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase3-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN DLQ ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:dlq" || true
            echo "=== ZCARD delayed ==="
            docker exec "$REDIS_CID" redis-cli ZCARD "{chasqui:${QUEUE}}:delayed" || true
          } | tee /tmp/phase3-redis-state.log

      - name: Flush Redis between phases (phase 3 -> phase 4)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 4 — Node delayed producer -> Python worker
        id: phase4
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase4-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '50'
          TAG: node
          JOB_NAME: cross-node-delayed
          EXPECT_TAG: node
          EXPECT_JOB_NAME: cross-node-delayed
          MODE: delayed
          TIMEOUT_SECS: '60'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx producer.ts 2>&1 | tee /tmp/phase4-producer.log
          python worker.py 2>&1 | tee /tmp/phase4-worker.log

      - name: Dump Redis state on Phase 4 failure
        if: failure() && steps.phase4.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase4-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN DLQ ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:dlq" || true
            echo "=== ZCARD delayed ==="
            docker exec "$REDIS_CID" redis-cli ZCARD "{chasqui:${QUEUE}}:delayed" || true
          } | tee /tmp/phase4-redis-state.log

      # ----------------------------------------------------------------
      # Phases 5–8: result-backend round-trip across all 4 directions.
      #
      # For each direction:
      #   1. Producer enqueues COUNT jobs with `STORE_RESULT=1`, capturing
      #      the engine-minted ids to JOB_IDS_FILE.
      #   2. Worker drains with `storeResults=true` and returns the
      #      JSON-decoded RESULT_VALUE from the handler. The engine's
      #      ok-result writer persists each result at
      #      `{chasqui:<queue>}:result:<jobId>`.
      #   3. Verifier (in the producer's language) reads each id back via
      #      `Queue.getJobResult` / `Queue.get_job_result` and asserts
      #      deep-equality with EXPECT_RESULT.
      #
      # Result payload uses mixed types (int, string, array, nested dict)
      # so the msgpack round-trip exercises the full type domain that
      # both shims share.
      # ----------------------------------------------------------------

      - name: Flush Redis between phases (phase 4 -> phase 5)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 5 — Python producer -> Python worker (result round-trip)
        id: phase5
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase5-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '20'
          TAG: py
          JOB_NAME: cross-result-py-py
          EXPECT_TAG: py
          EXPECT_JOB_NAME: cross-result-py-py
          MODE: immediate
          STORE_RESULT: '1'
          RESULT_VALUE: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          EXPECT_RESULT: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          JOB_IDS_FILE: /tmp/phase5-ids.txt
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          python producer.py 2>&1 | tee /tmp/phase5-producer.log
          python worker.py 2>&1 | tee /tmp/phase5-worker.log
          python verify_results.py 2>&1 | tee /tmp/phase5-verify.log

      - name: Dump Redis state on Phase 5 failure
        if: failure() && steps.phase5.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase5-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== KEYS result ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:result:*" || true
          } | tee /tmp/phase5-redis-state.log

      - name: Flush Redis between phases (phase 5 -> phase 6)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 6 — Node producer -> Node worker (result round-trip)
        id: phase6
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase6-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '20'
          TAG: node
          JOB_NAME: cross-result-node-node
          EXPECT_TAG: node
          EXPECT_JOB_NAME: cross-result-node-node
          MODE: immediate
          STORE_RESULT: '1'
          RESULT_VALUE: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          EXPECT_RESULT: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          JOB_IDS_FILE: /tmp/phase6-ids.txt
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx producer.ts 2>&1 | tee /tmp/phase6-producer.log
          npx tsx worker.ts 2>&1 | tee /tmp/phase6-worker.log
          npx tsx verify_results.ts 2>&1 | tee /tmp/phase6-verify.log

      - name: Dump Redis state on Phase 6 failure
        if: failure() && steps.phase6.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase6-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== KEYS result ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:result:*" || true
          } | tee /tmp/phase6-redis-state.log

      - name: Flush Redis between phases (phase 6 -> phase 7)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 7 — Python producer -> Node worker (result round-trip)
        id: phase7
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase7-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '20'
          TAG: py
          JOB_NAME: cross-result-py-node
          EXPECT_TAG: py
          EXPECT_JOB_NAME: cross-result-py-node
          MODE: immediate
          STORE_RESULT: '1'
          RESULT_VALUE: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          EXPECT_RESULT: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          JOB_IDS_FILE: /tmp/phase7-ids.txt
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          python producer.py 2>&1 | tee /tmp/phase7-producer.log
          npx tsx worker.ts 2>&1 | tee /tmp/phase7-worker.log
          python verify_results.py 2>&1 | tee /tmp/phase7-verify.log

      - name: Dump Redis state on Phase 7 failure
        if: failure() && steps.phase7.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase7-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== KEYS result ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:result:*" || true
          } | tee /tmp/phase7-redis-state.log

      - name: Flush Redis between phases (phase 7 -> phase 8)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 8 — Node producer -> Python worker (result round-trip)
        id: phase8
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase8-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '20'
          TAG: node
          JOB_NAME: cross-result-node-py
          EXPECT_TAG: node
          EXPECT_JOB_NAME: cross-result-node-py
          MODE: immediate
          STORE_RESULT: '1'
          RESULT_VALUE: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          EXPECT_RESULT: '{"ok":42,"msg":"result","tags":["a","b"],"nested":{"k":7}}'
          JOB_IDS_FILE: /tmp/phase8-ids.txt
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx producer.ts 2>&1 | tee /tmp/phase8-producer.log
          python worker.py 2>&1 | tee /tmp/phase8-worker.log
          npx tsx verify_results.ts 2>&1 | tee /tmp/phase8-verify.log

      - name: Dump Redis state on Phase 8 failure
        if: failure() && steps.phase8.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase8-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== KEYS result ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:result:*" || true
          } | tee /tmp/phase8-redis-state.log

      # ----------------------------------------------------------------
      # Phases 9–10: progress + log contract across both shim directions.
      #
      # For each direction:
      #   1. Producer enqueues COUNT jobs, capturing the engine-minted ids
      #      to JOB_IDS_FILE.
      #   2. Worker (other shim) drains with `EMIT_PROGRESS=1` so the
      #      handler calls `update_progress(75)` + appends two log lines
      #      before returning. `STORE_RESULT=1` keeps the completed jobs
      #      discoverable by the introspector's result-key probe.
      #   3. Verifier (producer's shim) reads each id back via
      #      `Queue.getJob(id).progress` + `Queue.getJobLogs(id)` and
      #      asserts deep-equality with EXPECT_PROGRESS / EXPECT_LOGS.
      #
      # Pinning a numeric progress (75) plus a two-line log sequence
      # exercises the ASCII-decimal `u8` STRING wire format and the
      # bounded-XRANGE log Stream read path in one round trip.
      # ----------------------------------------------------------------

      - name: Flush Redis between phases (phase 8 -> phase 9)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 9 — Node producer -> Python worker (progress + logs round-trip)
        id: phase9
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase9-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '5'
          TAG: node
          JOB_NAME: cross-progress-node-py
          EXPECT_TAG: node
          EXPECT_JOB_NAME: cross-progress-node-py
          MODE: immediate
          STORE_RESULT: '1'
          RESULT_VALUE: '1'
          EMIT_PROGRESS: '1'
          JOB_IDS_FILE: /tmp/phase9-ids.txt
          EXPECT_PROGRESS: '75'
          EXPECT_LOGS: '["step 1","step 2"]'
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          npx tsx producer.ts 2>&1 | tee /tmp/phase9-producer.log
          python worker.py 2>&1 | tee /tmp/phase9-worker.log
          npx tsx verify_progress.ts 2>&1 | tee /tmp/phase9-verify.log

      - name: Dump Redis state on Phase 9 failure
        if: failure() && steps.phase9.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase9-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== KEYS progress ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:progress:*" || true
            echo "=== KEYS log ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:log:*" || true
            echo "=== KEYS result ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:result:*" || true
          } | tee /tmp/phase9-redis-state.log

      - name: Flush Redis between phases (phase 9 -> phase 10)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 10 — Python producer -> Node worker (progress + logs round-trip)
        id: phase10
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase10-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '5'
          TAG: py
          JOB_NAME: cross-progress-py-node
          EXPECT_TAG: py
          EXPECT_JOB_NAME: cross-progress-py-node
          MODE: immediate
          STORE_RESULT: '1'
          RESULT_VALUE: '1'
          EMIT_PROGRESS: '1'
          JOB_IDS_FILE: /tmp/phase10-ids.txt
          EXPECT_PROGRESS: '75'
          EXPECT_LOGS: '["step 1","step 2"]'
          TIMEOUT_SECS: '30'
        shell: bash
        run: |
          set -euo pipefail
          python producer.py 2>&1 | tee /tmp/phase10-producer.log
          npx tsx worker.ts 2>&1 | tee /tmp/phase10-worker.log
          python verify_progress.py 2>&1 | tee /tmp/phase10-verify.log

      - name: Dump Redis state on Phase 10 failure
        if: failure() && steps.phase10.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase10-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XINFO STREAM ==="
            docker exec "$REDIS_CID" redis-cli XINFO STREAM "{chasqui:${QUEUE}}:stream" || true
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== KEYS progress ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:progress:*" || true
            echo "=== KEYS log ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:log:*" || true
            echo "=== KEYS result ==="
            docker exec "$REDIS_CID" redis-cli --scan --pattern "{chasqui:${QUEUE}}:result:*" || true
          } | tee /tmp/phase10-redis-state.log

      # ----------------------------------------------------------------
      # Phases 11–12: per-queue rate limiter — the SHARED-BUCKET proof.
      #
      # A Node worker and a Python worker run CONCURRENTLY on the same
      # queue, both configured with the SAME global limiter (10 jobs /
      # 1000ms). Because both FFI shims land on the same engine
      # `ConsumerConfig.rate_limit`, they draw from ONE Redis token bucket
      # (`{chasqui:<queue>}:limiter`). Over a 2-window observation the
      # queue-wide drained count is therefore bounded by ~the single
      # limiter's cap (cold-start full burst + 2 windows of refill), NOT
      # 2x. If the two paths each got their own bucket the drained count
      # would roughly double and the verifier's EXPECT_MAX ceiling trips.
      #
      #   - Producer seeds a burst (120) so neither limited worker drains
      #     the queue during the snapshot gap.
      #   - One shim runs `worker.{ts,py}` with LIMITER_MAX/DURATION_MS
      #     (drains until COUNT/timeout, limited).
      #   - The OTHER shim runs `verify_rate_limit.{ts,py}` (also limited),
      #     which snapshots waiting+active before/after a fixed window and
      #     asserts the queue-wide drained count is within [EXPECT_MIN,
      #     EXPECT_MAX]. EXPECT_MAX is set generously (45) for the shared
      #     bucket; a per-shim bucket would drain ~2x and breach it.
      #
      # Windows are deliberately coarse (10/1000ms) so timing jitter never
      # flakes the bound.
      # ----------------------------------------------------------------

      - name: Flush Redis between phases (phase 10 -> phase 11)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 11 — Node worker + Python verifier share ONE limiter bucket
        id: phase11
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase11-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '120'
          TAG: node
          JOB_NAME: cross-rl-shared-node-py
          EXPECT_TAG: node
          EXPECT_JOB_NAME: cross-rl-shared-node-py
          MODE: immediate
          LIMITER_MAX: '10'
          LIMITER_DURATION_MS: '1000'
          OBSERVE_WINDOWS: '2'
          EXPECT_MIN: '1'
          EXPECT_MAX: '45'
          TIMEOUT_SECS: '8'
        shell: bash
        run: |
          set -euo pipefail
          # Seed the burst.
          npx tsx producer.ts 2>&1 | tee /tmp/phase11-producer.log
          # Node limited worker drains in the background; the Python limited
          # verifier measures the SHARED-bucket-bounded queue-wide drained
          # count. Both draw from the same Redis limiter bucket.
          npx tsx worker.ts 2>&1 | tee /tmp/phase11-worker.log &
          NODE_WORKER_PID=$!
          set +e
          python verify_rate_limit.py 2>&1 | tee /tmp/phase11-verify.log
          VERIFY_RC=${PIPESTATUS[0]}
          set -e
          wait "$NODE_WORKER_PID" || true
          exit "$VERIFY_RC"

      - name: Dump Redis state on Phase 11 failure
        if: failure() && steps.phase11.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase11-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== HGETALL limiter bucket ==="
            docker exec "$REDIS_CID" redis-cli HGETALL "{chasqui:${QUEUE}}:limiter" || true
          } | tee /tmp/phase11-redis-state.log

      - name: Flush Redis between phases (phase 11 -> phase 12)
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          docker exec "$REDIS_CID" redis-cli FLUSHDB

      - name: Phase 12 — Python worker + Node verifier share ONE limiter bucket
        id: phase12
        working-directory: .github/cross-shim-tests
        env:
          QUEUE: cross-shim-phase12-${{ github.run_id }}-${{ github.run_attempt }}
          COUNT: '120'
          TAG: py
          JOB_NAME: cross-rl-shared-py-node
          EXPECT_TAG: py
          EXPECT_JOB_NAME: cross-rl-shared-py-node
          MODE: immediate
          LIMITER_MAX: '10'
          LIMITER_DURATION_MS: '1000'
          OBSERVE_WINDOWS: '2'
          EXPECT_MIN: '1'
          EXPECT_MAX: '45'
          TIMEOUT_SECS: '8'
        shell: bash
        run: |
          set -euo pipefail
          python producer.py 2>&1 | tee /tmp/phase12-producer.log
          # Python limited worker drains in the background; the Node limited
          # verifier measures the SHARED-bucket-bounded queue-wide drained
          # count. Both draw from the same Redis limiter bucket.
          python worker.py 2>&1 | tee /tmp/phase12-worker.log &
          PY_WORKER_PID=$!
          set +e
          npx tsx verify_rate_limit.ts 2>&1 | tee /tmp/phase12-verify.log
          VERIFY_RC=${PIPESTATUS[0]}
          set -e
          wait "$PY_WORKER_PID" || true
          exit "$VERIFY_RC"

      - name: Dump Redis state on Phase 12 failure
        if: failure() && steps.phase12.outcome == 'failure'
        env:
          QUEUE: cross-shim-phase12-${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          REDIS_CID=$(docker ps -qf 'ancestor=redis:8.6.2' | head -n1)
          {
            echo "=== XLEN main ==="
            docker exec "$REDIS_CID" redis-cli XLEN "{chasqui:${QUEUE}}:stream" || true
            echo "=== HGETALL limiter bucket ==="
            docker exec "$REDIS_CID" redis-cli HGETALL "{chasqui:${QUEUE}}:limiter" || true
          } | tee /tmp/phase12-redis-state.log

      - name: Upload phase logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cross-shim-logs
          path: |
            /tmp/phase1-producer.log
            /tmp/phase1-worker.log
            /tmp/phase2-producer.log
            /tmp/phase2-worker.log
            /tmp/phase3-producer.log
            /tmp/phase3-worker.log
            /tmp/phase4-producer.log
            /tmp/phase4-worker.log
            /tmp/phase1-redis-state.log
            /tmp/phase2-redis-state.log
            /tmp/phase3-redis-state.log
            /tmp/phase4-redis-state.log
            /tmp/phase5-producer.log
            /tmp/phase5-worker.log
            /tmp/phase5-verify.log
            /tmp/phase5-redis-state.log
            /tmp/phase6-producer.log
            /tmp/phase6-worker.log
            /tmp/phase6-verify.log
            /tmp/phase6-redis-state.log
            /tmp/phase7-producer.log
            /tmp/phase7-worker.log
            /tmp/phase7-verify.log
            /tmp/phase7-redis-state.log
            /tmp/phase8-producer.log
            /tmp/phase8-worker.log
            /tmp/phase8-verify.log
            /tmp/phase8-redis-state.log
            /tmp/phase9-producer.log
            /tmp/phase9-worker.log
            /tmp/phase9-verify.log
            /tmp/phase9-redis-state.log
            /tmp/phase10-producer.log
            /tmp/phase10-worker.log
            /tmp/phase10-verify.log
            /tmp/phase10-redis-state.log
            /tmp/phase11-producer.log
            /tmp/phase11-worker.log
            /tmp/phase11-verify.log
            /tmp/phase11-redis-state.log
            /tmp/phase12-producer.log
            /tmp/phase12-worker.log
            /tmp/phase12-verify.log
            /tmp/phase12-redis-state.log
          if-no-files-found: warn
