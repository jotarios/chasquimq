name: Docs Deploy

# Builds the Astro Starlight site under /site and deploys it to Cloudflare
# Pages.
#
# The live deploy fires only on a release version tag — the same
# '**[0-9]+.[0-9]+.[0-9]+*' signal crates-publish.yml and release.yml key
# on — so chasquimq.io republishes in lockstep with the npm / PyPI / crates
# packages. This prevents the live site advertising a shim option that the
# currently-published package does not have yet (the doc source on main can
# be accurate-as-of-main; publication is release-gated).
#
# PRs and pushes to main run the build-only smoke test (no secrets, no
# deploy) so contributors and forks can verify the site still compiles
# without needing access to the CF account.
#
# Per-PR live previews (wrangler pages deploy --branch=PR-N) are deferred
# to v1.1 — see site/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs-deploy.yml'
    tags:
      - '**[0-9]+.[0-9]+.[0-9]+*'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Only deploy from the canonical repo on a release version tag push (the
    # release signal the publish workflows share) or a manual dispatch. PRs,
    # forks, and ordinary pushes to main get the build-only smoke above so
    # the live site never runs ahead of the published package.
    if: |
      github.repository == 'jotarios/chasquimq' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')) ||
       github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v6

      - name: Download built site
        uses: actions/download-artifact@v7
        with:
          name: site-dist
          path: site/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=chasquimq
