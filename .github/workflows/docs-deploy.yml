name: Docs Deploy

# Builds the Astro Starlight site under /site and deploys it to Cloudflare
# Pages on push to main. PRs touching the site get a build-only smoke test
# (no secrets, no deploy) so contributors and forks can verify the site
# compiles without needing access to the CF account.
#
# Per-PR live previews (wrangler pages deploy --branch=PR-N) are deferred
# to v1.1 — see site/DEPLOYMENT.md.

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/docs-deploy.yml'
  workflow_dispatch:

concurrency:
  group: docs-deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload built site
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    runs-on: ubuntu-latest
    # Only deploy from the canonical repo's main branch on push (or manual
    # dispatch from main). PRs and forks get the build-only smoke above.
    if: |
      github.repository == 'jotarios/chasquimq' &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    steps:
      - uses: actions/checkout@v4

      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=chasquimq
